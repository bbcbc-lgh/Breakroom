[project]
name = "cyber-town-backend"
version = "0.1.0"
description = "Local FastAPI backend for the Cyber Town game prototype"
requires-python = ">=3.11,<3.12"
dependencies = [
    "aiosqlite>=0.21,<1",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.10,<3",
    "uvicorn>=0.35,<1",
]

[project.scripts]
cyber-town-backend = "CyberTown.main:run"

[dependency-groups]
dev = [
    "pyinstaller>=6.15,<7",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "pytest-cov>=6.2,<8",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["CyberTown"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
